<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>stackvm — live demo</title>
<style>
  :root{--bg:#0d1117;--card:#161b22;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--ok:#3fb950}
  *{box-sizing:border-box} body{margin:0;font-family:ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--text)}
  main{max-width:920px;margin:0 auto;padding:32px 18px 64px}
  h1{font-size:1.6rem;margin:0 0 6px} .sub{color:var(--muted);margin-bottom:20px}
  a{color:var(--accent)} textarea,pre{width:100%;background:var(--card);border:1px solid #30363d;border-radius:10px;color:var(--text);padding:12px;font:13px/1.45 ui-monospace,monospace}
  textarea{min-height:220px;resize:vertical} .row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
  button{background:#238636;border:0;color:#fff;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer}
  button.secondary{background:#21262d;border:1px solid #30363d}
  pre{min-height:120px;white-space:pre-wrap}
  .ok{color:var(--ok)}
</style>
</head>
<body>
<main>
  <h1>stackvm</h1>
  <p class="sub">Browser demo of the bytecode stack VM · <a href="https://github.com/SK090347/stackvm">source</a></p>
  <p>Edit a tiny <code>.svm</code>-style program, then Run. Opcodes: CONST, ADD, SUB, MUL, DIV, PRINT, HALT, plus JUMP / CALL in the full repo.</p>
  <textarea id="src">; factorial 6
CONST 6
STORE 0
CONST 1
STORE 1
LOOP:
LOAD 0
CONST 1
LT
JUMP_IF  DONE
LOAD 1
LOAD 0
MUL
STORE 1
LOAD 0
CONST 1
SUB
STORE 0
JUMP LOOP
DONE:
LOAD 1
PRINT
HALT
</textarea>
  <div class="row">
    <button id="run">Run</button>
    <button class="secondary" id="exFib">Load fib(10)</button>
    <button class="secondary" id="clear">Clear output</button>
  </div>
  <pre id="out" class="ok">output…</pre>
</main>
<script>
// Minimal educational interpreter (subset) for Pages demo
const fib = `; fib(10)
CONST 10
STORE 0
CONST 0
STORE 1
CONST 1
STORE 2
LOOP:
LOAD 0
CONST 0
EQ
JUMP_IF DONE
LOAD 1
LOAD 2
ADD
STORE 3
LOAD 2
STORE 1
LOAD 3
STORE 2
LOAD 0
CONST 1
SUB
STORE 0
JUMP LOOP
DONE:
LOAD 1
PRINT
HALT
`;
const out=document.getElementById('out');
document.getElementById('exFib').onclick=()=>{document.getElementById('src').value=fib};
document.getElementById('clear').onclick=()=>{out.textContent=''};
document.getElementById('run').onclick=()=>{
  try{ out.textContent = run(document.getElementById('src').value).join('\\n') || '(no PRINT)'; }
  catch(e){ out.textContent = 'error: '+e.message; out.className=''; }
};
function run(text){
  const lines=text.split(/\\n/).map(l=>l.replace(/;.*/,'').trim()).filter(Boolean);
  const labels={}; const code=[];
  for(const line of lines){
    if(line.endsWith(':')){ labels[line.slice(0,-1)] = code.length; continue; }
    const [op,...rest]=line.split(/\\s+/);
    code.push([op.toUpperCase(), rest.join(' ')]);
  }
  const stack=[]; const locals=Object.create(null); const prints=[];
  let ip=0, steps=0;
  while(ip<code.length && steps++<100000){
    const [op,arg]=code[ip++];
    const num=()=>Number(arg);
    switch(op){
      case 'CONST': stack.push(num()); break;
      case 'ADD': {const b=stack.pop(),a=stack.pop(); stack.push(a+b); break;}
      case 'SUB': {const b=stack.pop(),a=stack.pop(); stack.push(a-b); break;}
      case 'MUL': {const b=stack.pop(),a=stack.pop(); stack.push(a*b); break;}
      case 'DIV': {const b=stack.pop(),a=stack.pop(); stack.push(a/b); break;}
      case 'LT': {const b=stack.pop(),a=stack.pop(); stack.push(a<b?1:0); break;}
      case 'EQ': {const b=stack.pop(),a=stack.pop(); stack.push(a===b?1:0); break;}
      case 'STORE': locals[arg]=stack.pop(); break;
      case 'LOAD': stack.push(locals[arg]??0); break;
      case 'JUMP': ip=labels[arg]; break;
      case 'JUMP_IF': if(stack.pop()) ip=labels[arg]; break;
      case 'PRINT': prints.push(String(stack[stack.length-1])); break;
      case 'HALT': return prints;
      case 'POP': stack.pop(); break;
      default: throw new Error('unknown op '+op);
    }
  }
  throw new Error('step limit / missing HALT');
}
</script>
</body>
</html>
